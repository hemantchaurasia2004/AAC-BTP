[project]
name = "aac-backend"
version = "0.1.0"
description = "Agentic Adaptive Control simulation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "pydantic>=2.8.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
